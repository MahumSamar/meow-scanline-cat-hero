<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meow AI Agent — Your personal AI assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* everything scales off the 982 x 696 reference frame */
    --u: clamp(0.8px, min(calc(100vw / 982), calc(100vh / 696)), 1.7px);
    --gutter: calc(var(--u) * 21);
    --ink: #050505;
    --paper: #e7e7e7;
  }

  html, body { height: 100%; background: var(--paper); }

  body {
    font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  .hero {
    position: relative;
    height: 100vh;
    min-height: 460px;
    width: 100%;
    overflow: hidden;
    isolation: isolate;
    background: var(--paper);
  }

  .hero__media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% 50%;
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- nav ---------- */
  .nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: calc(var(--u) * 80);
    padding: 0 calc(var(--u) * 23) 0 var(--gutter);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .nav__logo { display: block; width: calc(var(--u) * 22); height: calc(var(--u) * 22); }
  .nav__logo svg { display: block; width: 100%; height: 100%; }

  .nav__links { display: flex; gap: calc(var(--u) * 25); list-style: none; }
  .nav__links a {
    font-size: calc(var(--u) * 11);
    line-height: 1;
    letter-spacing: -0.01em;
    transition: opacity .2s ease;
  }
  .nav__links a:hover { opacity: .55; }

  .nav__toggle {
    display: none;
    width: calc(var(--u) * 40);
    height: calc(var(--u) * 40);
    margin-right: calc(var(--u) * -9);
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--ink);
  }
  .nav__toggle span,
  .nav__toggle span::before {
    content: "";
    display: block;
    width: calc(var(--u) * 22);
    height: calc(var(--u) * 2);
    margin: 0 auto;
    background: currentColor;
    transition: transform .25s ease;
  }
  .nav__toggle span { transform: translateY(calc(var(--u) * -3.5)); }
  .nav__toggle span::before { transform: translateY(calc(var(--u) * 7)); }
  .nav.is-open .nav__toggle span { transform: rotate(45deg); }
  .nav.is-open .nav__toggle span::before { transform: rotate(-90deg); }

  /* ---------- headline ---------- */
  .hero__title {
    position: absolute;
    top: 23.1%;
    left: calc(var(--u) * 27);
    width: calc(var(--u) * 396);
    line-height: 0;
  }
  .hero__title svg { display: block; width: 100%; height: auto; fill: var(--ink); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* ---------- copy + actions ---------- */
  .hero__body {
    position: absolute;
    left: var(--gutter);
    bottom: 17.4%;
  }
  .hero__lede {
    font-size: calc(var(--u) * 13.3);
    line-height: calc(var(--u) * 17);
    letter-spacing: 0;
    margin-bottom: calc(var(--u) * 46);
  }
  .hero__actions { display: flex; align-items: center; gap: calc(var(--u) * 17); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: calc(var(--u) * 31);
    padding: 0 calc(var(--u) * 19);
    border-radius: calc(var(--u) * 2);
    background: var(--ink);
    color: #dcdcda;
    font-size: calc(var(--u) * 11);
    line-height: 1;
    white-space: nowrap;
    transition: background-color .2s ease, transform .2s ease;
  }
  .btn:hover { background: #2a2a2a; transform: translateY(-1px); }

  .link {
    display: inline-flex;
    align-items: center;
    gap: calc(var(--u) * 9);
    font-size: calc(var(--u) * 11);
    line-height: 1;
    white-space: nowrap;
  }
  .link svg {
    width: calc(var(--u) * 5);
    height: calc(var(--u) * 8);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    transition: transform .2s ease;
  }
  .link:hover svg { transform: translateX(calc(var(--u) * 3)); }

  /* ---------- tablet / mobile ---------- */
  @media (max-width: 720px) {
    :root {
      --u: clamp(0.8px, calc(100vw / 400), 1.5px);
      --gutter: calc(var(--u) * 20);
    }

    .hero { min-height: calc(var(--u) * 620); }

    /* the cat sits in a band between the headline and the copy */
    .hero__media {
      top: 27%;
      height: 50%;
      object-position: 73% 50%;
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
              mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
    }

    .nav { height: calc(var(--u) * 68); padding-right: var(--gutter); }
    .nav__logo { width: calc(var(--u) * 26); height: calc(var(--u) * 26); }
    .nav__toggle { display: block; }

    .nav__links {
      position: absolute;
      top: 100%;
      left: var(--gutter);
      right: var(--gutter);
      flex-direction: column;
      gap: 0;
      padding: calc(var(--u) * 6) calc(var(--u) * 16);
      background: var(--ink);
      border-radius: calc(var(--u) * 2);
      opacity: 0;
      visibility: hidden;
      transform: translateY(calc(var(--u) * -6));
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    .nav.is-open .nav__links { opacity: 1; visibility: visible; transform: none; }
    .nav__links a {
      display: block;
      padding: calc(var(--u) * 14) 0;
      font-size: calc(var(--u) * 14);
      color: #ececea;
    }
    .nav__links li + li { border-top: 1px solid rgba(255, 255, 255, .14); }

    .hero__title {
      top: calc(var(--u) * 92);
      left: var(--gutter);
      width: min(calc(100% - var(--gutter) * 2), calc(var(--u) * 396));
    }

    .hero__body { right: var(--gutter); bottom: calc(var(--u) * 36); }
    .hero__lede {
      font-size: calc(var(--u) * 14);
      line-height: calc(var(--u) * 20);
      margin-bottom: calc(var(--u) * 24);
      max-width: 26em;
    }
    .hero__lede br { display: none; }
    .btn { height: calc(var(--u) * 42); padding: 0 calc(var(--u) * 22); font-size: calc(var(--u) * 13); }
    .link { font-size: calc(var(--u) * 13); }
  }

  /* short landscape phones */
  @media (max-width: 720px) and (max-height: 520px) {
    .hero__media { top: 0; height: 100%; object-position: 100% 50%; -webkit-mask-image: none; mask-image: none; }
    .hero__title { width: calc(var(--u) * 230); top: calc(var(--u) * 70); }
  }
</style>
</head>

<script>
  (function () {
    var nav = document.getElementById('nav');
    var toggle = document.getElementById('navToggle');
    function setOpen(open) {
      nav.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open);
    }
    toggle.addEventListener('click', function () { setOpen(!nav.classList.contains('is-open')); });
    document.getElementById('navLinks').addEventListener('click', function (e) {
      if (e.target.tagName === 'A') setOpen(false);
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelector('.hero__media').pause();
    }
  })();
</script>
